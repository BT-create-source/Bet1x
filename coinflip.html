<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinflip — bet1x</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261014j">
  <link rel="stylesheet" href="assets/css/game-shell.css?v=20261014i">
  <link rel="stylesheet" href="assets/css/originals.css?v=20261106c">
  <style>
    .cf-scene { perspective: 900px; margin: 6px 0 22px; }
    .cf-coin { width: 190px; height: 190px; position: relative; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.25,.9,.3,1); }
    .cf-face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
      font: 900 64px var(--font-display); box-shadow: inset 0 0 0 10px rgba(0,0,0,.12), inset 0 -10px 30px rgba(0,0,0,.25), 0 14px 40px rgba(0,0,0,.5); }
    .cf-face.h { background: radial-gradient(circle at 35% 30%, #ffe9a6, #ffc53d 55%, #b9851b); color: #6b4700; }
    .cf-face.t { background: radial-gradient(circle at 35% 30%, #f3f5ff, #a9b1d6 55%, #5b638f); color: #2a3060; transform: rotateY(180deg); }
    .cf-face small { font: 700 13px var(--font-body); position: absolute; bottom: 40px; letter-spacing: 2px; }
    .cf-ladder { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
    .cf-step { min-width: 66px; padding: 8px 6px; border-radius: 10px; text-align: center; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-dim);
      font: 700 13px var(--font-mono); transition: all .2s; }
    .cf-step small { display: block; font: 600 10px var(--font-body); color: var(--text-faint); margin-bottom: 2px; }
    .cf-step.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .cf-step.next { border-color: var(--gold); color: var(--gold); }
    .cf-flips { display: flex; gap: 6px; margin-top: 14px; min-height: 30px; flex-wrap: wrap; justify-content: center; }
    .cf-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 12px var(--font-display); }
    .cf-dot.h { background: #ffc53d; color: #6b4700; } .cf-dot.t { background: #a9b1d6; color: #2a3060; }
    .cf-dot.miss { box-shadow: 0 0 0 3px var(--red); }
    .cf-open { display: none; flex-direction: column; gap: 8px; }
    .cf-open.show { display: flex; }
    .cf-cash { font-size: 15px; }
  </style>
</head>
<body class="exchange-theme originals-game">
  <nav class="navbar exchange-header">
    <div class="exchange-logo-box">Bet1x</div>
    <div id="headerAuthArea"></div>
  </nav>
  <main class="og-wrap" id="og"></main>
  <div class="footer">bet1x — play responsibly; 18+ only.</div>

  <script src="assets/js/ui-common.js?v=20261014l"></script>
  <script src="assets/js/password-eye.js?v=20261104b"></script>
  <script src="assets/js/sound-fx.js"></script>
  <script src="assets/js/originals.js?v=20261106b"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    let side = 'heads', spins = 0;

    function ladder(streak) {
      const lad = (Orig.state.info && Orig.state.info.ladder) || [];
      $('cfLadder').innerHTML = lad.map((m, i) => '<div class="cf-step ' + (i < streak ? 'done' : i === streak ? 'next' : '') + '"><small>' + (i + 1) + ' in a row</small>' + Orig.fmtMult(m) + '</div>').join('');
    }
    function flipsRow(flips) {
      $('cfFlips').innerHTML = (flips || []).map((f) => '<div class="cf-dot ' + (f.side === 'heads' ? 'h' : 't') + (f.win ? '' : ' miss') + '">' + (f.side === 'heads' ? 'H' : 'T') + '</div>').join('');
    }
    function setSide(s) { side = s; document.querySelectorAll('#cfSide button').forEach((b) => b.classList.toggle('on', b.dataset.s === s)); }
    async function spin(to) {
      spins += 1;
      $('cfCoin').style.transform = 'rotateY(' + (spins * 1800 + (to === 'tails' ? 180 : 0)) + 'deg)';
      Orig.sound('coinDrop');
      await Orig.sleep(1150);
    }
    function ui(round) {
      const open = round && round.status === 'open';
      $('ogPlay').style.display = open ? 'none' : '';
      $('cfOpen').classList.toggle('show', !!open);
      document.querySelectorAll('[data-og-lock]').forEach((el) => { if (el.closest('.og-amount') || el.closest('.og-quick')) el.disabled = !!open; });
      const r = round ? round.result : null;
      ladder(r ? (round.status === 'open' || r.ended !== 'lost' ? r.streak : 0) : 0);
      flipsRow(r ? r.flips : []);
      if (open) $('cfCash').textContent = 'Cash out ' + Orig.money(round.bet * r.multiplier) + ' (' + Orig.fmtMult(r.multiplier) + ')';
    }

    Orig.mount({
      game: 'coinflip', title: 'Coinflip', sub: 'Double up, streak to 1000x', playLabel: 'Flip',
      controls: '<div class="og-field"><div class="og-lbl"><span>Your call</span></div><div class="og-seg" id="cfSide"><button type="button" data-s="heads" class="on">Heads</button><button type="button" data-s="tails">Tails</button></div></div>',
      afterPlay: '<div class="cf-open" id="cfOpen"><button type="button" class="og-play green cf-cash" id="cfCash">Cash out</button>' +
        '<div class="og-row2"><button type="button" class="og-chipbtn" id="cfAgainH" data-og-lock>Flip again: Heads</button><button type="button" class="og-chipbtn" id="cfAgainT" data-og-lock>Flip again: Tails</button></div></div>',
      stage: '<div class="cf-scene"><div class="cf-coin" id="cfCoin"><div class="cf-face h">H<small>HEADS</small></div><div class="cf-face t">T<small>TAILS</small></div></div></div>' +
        '<div class="cf-ladder" id="cfLadder"></div><div class="cf-flips" id="cfFlips"></div>',
      howto: (info) => 'Call <b>Heads</b> or <b>Tails</b> and flip. Every correct call doubles your multiplier (minus a small edge once): ' +
        (info.ladder || []).slice(0, 4).map(Orig.fmtMult).join(' → ') + ' … up to <b>' + Orig.fmtMult((info.ladder || [0]).slice(-1)[0]) + '</b> for ten in a row. ' +
        'After any win, <b>cash out</b> or flip again — a wrong call loses the stake.',
      collect: () => ({ side }),
      noBanner: false,
      resultText: (r) => (r.result.flips || []).map((f) => f.side === 'heads' ? 'H' : 'T').join('') + ' <span style="color:var(--text-dim)">' + (r.result.ended || '') + '</span>',
      verifyFloats: 3,
      verify: (f) => 'Flips: ' + f.slice(0, 3).map((x) => (x < 0.5 ? 'Heads' : 'Tails') + ' (' + x.toFixed(4) + ')').join(', ') + ' — under 0.5 is Heads.',
      onMount: () => {
        document.querySelectorAll('#cfSide button').forEach((b) => { b.onclick = () => { setSide(b.dataset.s); Orig.sound('click'); }; });
        $('cfCash').onclick = () => Orig.action('cashout');
        $('cfAgainH').onclick = () => { setSide('heads'); Orig.action('flip', { side: 'heads' }); };
        $('cfAgainT').onclick = () => { setSide('tails'); Orig.action('flip', { side: 'tails' }); };
      },
      onLoad: (d) => { ui(d.open_round); },
      onResult: async (round) => { const f = round.result.flips; await spin(f[f.length - 1].side); ui(round); },
      onAction: async (round, name) => {
        if (name === 'flip') { const f = round.result.flips; await spin(f[f.length - 1].side); }
        ui(round);
      },
    });
  })();
  </script>
  <script src="assets/js/game-shell.js?v=20261105a" defer></script>
</body>
</html>
