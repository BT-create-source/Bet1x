  <g transform="translate(320 300)"><rect width="110" height="30" rx="6" fill="#f6a21a"/><path d="M14 0 L32 0 L22 30 L4 30 Z M50 0 L68 0 L58 30 L40 30 Z M86 0 L104 0 L94 30 L76 30 Z" fill="#45434c"/></g>
