    <path d="M25 51 L24 60 M24 60 L20 62 M24 60 L27 62 M34 51 L35 60 M35 60 L31 62 M35 60 L38 62" stroke="#ffad1f" stroke-width="2.4" stroke-linecap="round" fill="none"/>
