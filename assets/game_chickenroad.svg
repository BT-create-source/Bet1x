  </g>
  <!-- cars -->
  <g transform="translate(345 70)"><rect width="60" height="108" rx="16" fill="#3d8bfd"/><rect x="7" y="58" width="46" height="22" rx="6" fill="#141626" opacity="0.85"/><rect x="7" y="20" width="46" height="16" rx="5" fill="#141626" opacity="0.75"/></g>
  <g transform="translate(680 560)"><rect width="60" height="108" rx="16" fill="#a56bff"/><rect x="7" y="58" width="46" height="22" rx="6" fill="#141626" opacity="0.85"/><rect x="7" y="20" width="46" height="16" rx="5" fill="#141626" opacity="0.75"/></g>
