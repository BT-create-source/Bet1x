  <circle cx="545" cy="430" r="62" fill="url(#steel)" stroke="#1d1f2c" stroke-width="8"/>
  <circle cx="715" cy="430" r="62" fill="url(#steel)" stroke="#1d1f2c" stroke-width="8"/>
