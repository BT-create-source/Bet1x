<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23253a"/><stop offset="0.5" stop-color="#2d3046"/><stop offset="1" stop-color="#1c1e30"/>
    </linearGradient>
    <radialGradient id="gold" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset="0.55" stop-color="#f2b229"/><stop offset="1" stop-color="#a86d06"/>
    </radialGradient>
    <radialGradient id="steel" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#8a8fa6"/><stop offset="0.55" stop-color="#555a70"/><stop offset="1" stop-color="#3b3f52"/>
    </radialGradient>
    <radialGradient id="egg" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fff6c8"/><stop offset="0.45" stop-color="#ffc53d"/><stop offset="1" stop-color="#b9780a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc53d" stop-opacity="0.55"/><stop offset="1" stop-color="#ffc53d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d0a"/><stop offset="0.6" stop-color="#ff9f1a"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#road)"/>
  <rect x="0" y="0" width="120" height="800" fill="#363b5c"/>
  <rect x="112" y="0" width="10" height="800" fill="#c9cde0"/>
